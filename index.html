    <!-- Light is the default; only an explicit saved choice turns on dark mode.
         Applied before paint so dark mode never flashes white. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage blocked — fall back to light */
        }
